name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"  # Windows console defaults to cp1252 and can't print Chinese

permissions:
  contents: write  # attach the installer to releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Make app icon from logo
        run: python packaging/make_icon.py
      - name: Smoke test (OCR on a sample image)
        run: python packaging/smoke_test.py
      - name: Build app folder
        working-directory: packaging
        run: pyinstaller --noconfirm --distpath ../dist --workpath ../build clipsep.spec
      - name: Install Inno Setup Chinese language file
        shell: pwsh
        run: |
          $dst = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\ChineseTraditional.isl"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseTraditional.isl" -OutFile $dst
      - name: Build installer
        shell: pwsh
        run: |
          $env:APP_VERSION = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.1.${env:GITHUB_RUN_NUMBER}" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - name: Zip installer
        shell: pwsh
        run: Get-ChildItem dist\ClipSep-Setup-*.exe | ForEach-Object { Compress-Archive -Path $_.FullName -DestinationPath ($_.FullName -replace '\.exe$', '.zip') }
      - uses: actions/upload-artifact@v4
        with:
          name: ClipSep-Setup
          path: dist/ClipSep-Setup-*.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.{0}', github.run_number) }}
          name: 剪報圖片文字分離編輯器 ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.{0}', github.run_number) }}
          body: 下載下方的 ClipSep-Setup zip，解壓縮後執行 ClipSep-Setup.exe 安裝。
          make_latest: true
          files: dist/ClipSep-Setup-*.zip
